<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord-like WebSocket Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #36393f;
            color: #dcddde;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 240px;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #202225;
        }

        .server-info {
            padding: 20px;
            border-bottom: 1px solid #202225;
            background-color: #202225;
        }

        .server-info h2 {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .server-info .status {
            font-size: 12px;
            color: #b9bbbe;
        }

        .channels {
            flex: 1;
            padding: 20px 0;
        }

        .channel-header {
            padding: 0 20px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #8e9297;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .channel {
            padding: 6px 20px;
            cursor: pointer;
            color: #8e9297;
            transition: all 0.2s;
            font-size: 16px;
        }

        .channel:hover {
            background-color: #34373c;
            color: #dcddde;
        }

        .channel.active {
            background-color: #5865f2;
            color: #ffffff;
        }

        .channel::before {
            content: "# ";
            margin-right: 6px;
        }

        .user-info {
            padding: 20px;
            border-top: 1px solid #202225;
            background-color: #292b2f;
        }

        .user-info input {
            width: 100%;
            padding: 8px;
            background-color: #40444b;
            border: none;
            border-radius: 4px;
            color: #dcddde;
            font-size: 14px;
        }

        .user-info input:focus {
            outline: none;
            background-color: #484c52;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 60px;
            background-color: #36393f;
            border-bottom: 1px solid #202225;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .chat-header h3 {
            color: #ffffff;
            font-size: 16px;
        }

        .chat-header::before {
            content: "# ";
            color: #8e9297;
            margin-right: 6px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #36393f;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            padding: 2px 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .username {
            font-weight: 600;
            color: #ffffff;
            margin-right: 8px;
            font-size: 16px;
        }

        .timestamp {
            font-size: 12px;
            color: #72767d;
        }

        .message-text {
            color: #dcddde;
            line-height: 1.375;
            font-size: 16px;
            word-wrap: break-word;
        }

        .system-message {
            font-style: italic;
            color: #8e9297;
            font-size: 14px;
        }

        .message-input-container {
            padding: 20px;
            background-color: #36393f;
        }

        .message-input {
            width: 100%;
            padding: 12px 16px;
            background-color: #40444b;
            border: none;
            border-radius: 8px;
            color: #dcddde;
            font-size: 16px;
            resize: none;
            min-height: 44px;
            max-height: 200px;
        }

        .message-input:focus {
            outline: none;
            background-color: #484c52;
        }

        .message-input::placeholder {
            color: #6d7075;
        }

        .users-panel {
            width: 200px;
            background-color: #2f3136;
            border-left: 1px solid #202225;
            padding: 20px 0;
        }

        .users-header {
            padding: 0 20px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #8e9297;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user {
            padding: 2px 20px;
            color: #8e9297;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .user::before {
            content: "●";
            color: #43b581;
            margin-right: 8px;
            font-size: 12px;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
        }

        .connected {
            background-color: #43b581;
            color: #ffffff;
        }

        .disconnected {
            background-color: #ed4245;
            color: #ffffff;
        }

        .connecting {
            background-color: #faa61a;
            color: #000000;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .users-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>
    
    <div class="sidebar">
        <div class="server-info">
            <h2>Test WebSocket Server</h2>
            <div class="status">Discord-like Chat</div>
        </div>
        
        <div class="channels">
            <div class="channel-header">Text Channels</div>
            <div class="channel active" data-channel="general">general</div>
            <div class="channel" data-channel="random">random</div>
        </div>
        
        <div class="user-info">
            <input type="text" id="usernameInput" placeholder="Enter username" maxlength="20">
        </div>
    </div>
    
    <div class="main-content">
        <div class="chat-header">
            <h3 id="currentChannel">general</h3>
        </div>
        
        <div class="messages" id="messages"></div>
        
        <div class="message-input-container">
            <textarea 
                class="message-input" 
                id="messageInput" 
                placeholder="Message #general"
                rows="1"
                disabled
            ></textarea>
        </div>
    </div>
    
    <div class="users-panel">
        <div class="users-header">Online Users</div>
        <div id="usersList"></div>
    </div>

    <script>
        class DiscordChat {
            constructor() {
                this.ws = null;
                this.currentChannel = 'general';
                this.username = '';
                this.isConnected = false;
                
                this.initializeElements();
                this.bindEvents();
                this.updateConnectionStatus('disconnected');
            }
            
            initializeElements() {
                this.usernameInput = document.getElementById('usernameInput');
                this.messageInput = document.getElementById('messageInput');
                this.messagesContainer = document.getElementById('messages');
                this.usersList = document.getElementById('usersList');
                this.currentChannelHeader = document.getElementById('currentChannel');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.channels = document.querySelectorAll('.channel');
            }
            
            bindEvents() {
                // Username input
                this.usernameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.setUsername();
                    }
                });
                
                // Message input
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                // Channel switching
                this.channels.forEach(channel => {
                    channel.addEventListener('click', () => {
                        this.switchChannel(channel.dataset.channel);
                    });
                });
                
                // Auto-resize textarea
                this.messageInput.addEventListener('input', () => {
                    this.messageInput.style.height = 'auto';
                    this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 200) + 'px';
                });
            }
            
            setUsername() {
                const username = this.usernameInput.value.trim();
                if (username) {
                    this.username = username;
                    this.usernameInput.disabled = true;
                    this.connect();
                }
            }
            
            connect() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    return;
                }
                
                this.updateConnectionStatus('connecting');
                
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws?username=${encodeURIComponent(this.username)}`;
                
                this.ws = new WebSocket(wsUrl);
                
                this.ws.onopen = () => {
                    this.isConnected = true;
                    this.updateConnectionStatus('connected');
                    this.messageInput.disabled = false;
                    this.messageInput.placeholder = `Message #${this.currentChannel}`;
                    
                    // Join current channel
                    this.joinChannel(this.currentChannel);
                    
                    // Get channels and users
                    this.requestChannels();
                    this.requestUsers(this.currentChannel);
                };
                
                this.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    this.handleMessage(data);
                };
                
                this.ws.onclose = () => {
                    this.isConnected = false;
                    this.updateConnectionStatus('disconnected');
                    this.messageInput.disabled = true;
                    this.messageInput.placeholder = 'Enter username to start chatting';
                    
                    // Try to reconnect after 3 seconds
                    setTimeout(() => {
                        if (!this.isConnected && this.username) {
                            this.connect();
                        }
                    }, 3000);
                };
                
                this.ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    this.updateConnectionStatus('disconnected');
                };
            }
            
            handleMessage(data) {
                switch (data.type) {
                    case 'message':
                        this.displayMessage(data.payload);
                        break;
                    case 'user_list':
                        this.updateUsersList(data.payload.users);
                        break;
                    case 'channel_list':
                        // Handle channel list if needed
                        break;
                    case 'joined_channel':
                        this.requestUsers(this.currentChannel);
                        break;
                }
            }
            
            displayMessage(message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
                
                if (message.type === 'join' || message.type === 'leave') {
                    messageElement.innerHTML = `
                        <div class="message-content">
                            <div class="system-message">${message.content}</div>
                        </div>
                    `;
                } else {
                    const timestamp = new Date(message.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    messageElement.innerHTML = `
                        <div class="message-content">
                            <div class="message-header">
                                <span class="username">${message.username}</span>
                                <span class="timestamp">${timestamp}</span>
                            </div>
                            <div class="message-text">${this.escapeHtml(message.content)}</div>
                        </div>
                    `;
                }
                
                this.messagesContainer.appendChild(messageElement);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }
            
            updateUsersList(users) {
                this.usersList.innerHTML = '';
                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = 'user';
                    userElement.textContent = user.username;
                    this.usersList.appendChild(userElement);
                });
            }
            
            sendMessage() {
                const content = this.messageInput.value.trim();
                if (content && this.isConnected) {
                    const message = {
                        type: 'send_message',
                        payload: {
                            channel_id: this.currentChannel,
                            content: content
                        }
                    };
                    this.ws.send(JSON.stringify(message));
                    this.messageInput.value = '';
                    this.messageInput.style.height = 'auto';
                }
            }
            
            joinChannel(channelId) {
                if (this.isConnected) {
                    const message = {
                        type: 'join_channel',
                        payload: {
                            channel_id: channelId,
                            username: this.username
                        }
                    };
                    this.ws.send(JSON.stringify(message));
                }
            }
            
            switchChannel(channelId) {
                this.currentChannel = channelId;
                this.currentChannelHeader.textContent = channelId;
                this.messageInput.placeholder = `Message #${channelId}`;
                
                // Update active channel in sidebar
                this.channels.forEach(ch => ch.classList.remove('active'));
                document.querySelector(`[data-channel="${channelId}"]`).classList.add('active');
                
                // Clear messages and join new channel
                this.messagesContainer.innerHTML = '';
                this.usersList.innerHTML = '';
                
                if (this.isConnected) {
                    this.joinChannel(channelId);
                    this.requestUsers(channelId);
                }
            }
            
            requestChannels() {
                if (this.isConnected) {
                    const message = {
                        type: 'get_channels',
                        payload: {}
                    };
                    this.ws.send(JSON.stringify(message));
                }
            }
            
            requestUsers(channelId) {
                if (this.isConnected) {
                    const message = {
                        type: 'get_users',
                        payload: {
                            channel_id: channelId
                        }
                    };
                    this.ws.send(JSON.stringify(message));
                }
            }
            
            updateConnectionStatus(status) {
                this.connectionStatus.className = `connection-status ${status}`;
                switch (status) {
                    case 'connected':
                        this.connectionStatus.textContent = 'Connected';
                        break;
                    case 'connecting':
                        this.connectionStatus.textContent = 'Connecting...';
                        break;
                    case 'disconnected':
                        this.connectionStatus.textContent = 'Disconnected';
                        break;
                }
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // Initialize the chat application
        const chat = new DiscordChat();
    </script>
</body>
</html>
